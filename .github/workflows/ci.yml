name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: de
          POSTGRES_PASSWORD: de
          POSTGRES_DB: de
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U de" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests (embedded Postgres)
        run: npm test
      - name: Tests (Postgres 16)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://de:de@localhost:5432/de

  plugin:
    # The Claude Code plugin: manifest, hooks module and its tests, checked by Claude Code itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/claude-code
      - run: claude plugin test plugins/claude-code
